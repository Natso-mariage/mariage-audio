<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un message pour les mariés 💍</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #f7eee8, #fffaf7);
            color: #5c4033;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(92, 64, 51, 0.15);
        }

        .heart {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: normal;
            color: #8a5a44;
        }

        .subtitle {
            font-size: 17px;
            line-height: 1.6;
            margin: 15px 0 30px;
            color: #80675a;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddc8ba;
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #a9785c;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 16px;
            font-size: 17px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        #startButton {
            background: #a9785c;
            color: white;
        }

        #startButton:hover {
            background: #8f624b;
        }

        #recordButton {
            background: #b85c5c;
            color: white;
            margin-top: 15px;
        }

        #stopButton {
            background: #6d5144;
            color: white;
            margin-top: 15px;
        }

        #sendButton {
            background: #7d9b76;
            color: white;
            margin-top: 15px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .recording {
            margin: 20px 0;
            font-size: 18px;
        }

        .timer {
            font-size: 38px;
            font-weight: bold;
            margin: 10px 0;
            color: #a64d4d;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }

        .success {
            background: #e9f4e5;
            color: #45643d;
        }

        .error {
            background: #fae5e5;
            color: #873d3d;
        }

        .audio-preview {
            width: 100%;
            margin-top: 20px;
        }

        .small {
            margin-top: 25px;
            font-size: 13px;
            color: #9a8174;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="heart">💍</div>

    <h1>Un message pour les mariés</h1>

    <p class="subtitle">
        Laissez-nous un petit message audio,
        un souvenir, une bénédiction ou simplement quelques mots d'amour. ❤️
    </p>

    <!-- ÉTAPE 1 -->
    <div id="nameSection">

        <label for="guestName">
            Votre prénom
        </label>

        <input
            type="text"
            id="guestName"
            placeholder="Exemple : Marie"
            maxlength="50"
            autocomplete="name"
        >

        <button id="startButton">
            🎙️ Commencer mon message
        </button>

    </div>


    <!-- ÉTAPE 2 -->
    <div id="recordSection" class="hidden">

        <p>
            Bonjour <strong id="displayName"></strong> ❤️
        </p>

        <p>
            Appuyez sur le bouton pour commencer votre message.
        </p>

        <button id="recordButton">
            🔴 Commencer l'enregistrement
        </button>

        <button id="stopButton" class="hidden">
            ⏹️ Arrêter l'enregistrement
        </button>

        <div id="recordingStatus" class="recording hidden">
            <div>🎙️ Enregistrement en cours...</div>
            <div id="timer" class="timer">00:00</div>
        </div>

        <audio
            id="audioPreview"
            class="audio-preview hidden"
            controls>
        </audio>

        <button id="sendButton" class="hidden">
            💌 Envoyer mon message
        </button>

    </div>


    <!-- MESSAGE -->
    <div id="status"></div>

    <div class="small">
        Merci de participer à ce souvenir unique. ❤️
    </div>

</div>


<script>

    // =========================================================
    // CONFIGURATION SUPABASE
    // =========================================================

    const SUPABASE_URL = "https://prwrmivexadjyonqrxbv.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_CjH7zwRp741-absceWdu9A_T5BL5wnN";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =========================================================
    // VARIABLES
    // =========================================================

    let guestName = "";
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let timerInterval = null;
    let seconds = 0;


    // =========================================================
    // ELEMENTS HTML
    // =========================================================

    const nameSection =
        document.getElementById("nameSection");

    const recordSection =
        document.getElementById("recordSection");

    const guestNameInput =
        document.getElementById("guestName");

    const displayName =
        document.getElementById("displayName");

    const startButton =
        document.getElementById("startButton");

    const recordButton =
        document.getElementById("recordButton");

    const stopButton =
        document.getElementById("stopButton");

    const sendButton =
        document.getElementById("sendButton");

    const audioPreview =
        document.getElementById("audioPreview");

    const recordingStatus =
        document.getElementById("recordingStatus");

    const timer =
        document.getElementById("timer");

    const status =
        document.getElementById("status");


    // =========================================================
    // MESSAGE
    // =========================================================

    function showMessage(message, type = "") {

        status.innerHTML = message;

        status.className = "status " + type;

    }


    // =========================================================
    // ETAPE 1 : PRENDRE LE PRENOM
    // =========================================================

    startButton.addEventListener("click", function () {

        guestName =
            guestNameInput.value.trim();

        if (!guestName) {

            showMessage(
                "Veuillez entrer votre prénom. 😊",
                "error"
            );

            return;
        }

        displayName.textContent =
            guestName;

        nameSection.classList.add("hidden");

        recordSection.classList.remove("hidden");

        showMessage("");

    });


    // =========================================================
    // ETAPE 2 : DEMARRER ENREGISTREMENT
    // =========================================================

    recordButton.addEventListener("click", async function () {

        try {

            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {

                showMessage(
                    "Votre navigateur ne permet pas l'utilisation du microphone.",
                    "error"
                );

                return;
            }


            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });


            audioChunks = [];


            let mimeType = "";

            if (MediaRecorder.isTypeSupported("audio/webm")) {

                mimeType = "audio/webm";

            } else if (MediaRecorder.isTypeSupported("audio/mp4")) {

                mimeType = "audio/mp4";

            } else if (MediaRecorder.isTypeSupported("audio/ogg")) {

                mimeType = "audio/ogg";
            }


            mediaRecorder =
                mimeType
                    ? new MediaRecorder(stream, { mimeType })
                    : new MediaRecorder(stream);


            mediaRecorder.addEventListener(
                "dataavailable",
                function (event) {

                    if (event.data.size > 0) {

                        audioChunks.push(event.data);

                    }

                }
            );


            mediaRecorder.addEventListener(
                "stop",
                function () {

                    audioBlob = new Blob(
                        audioChunks,
                        {
                            type:
                                mimeType ||
                                "audio/webm"
                        }
                    );


                    const audioURL =
                        URL.createObjectURL(audioBlob);

                    audioPreview.src =
                        audioURL;

                    audioPreview.classList.remove("hidden");

                    sendButton.classList.remove("hidden");

                    stream.getTracks().forEach(
                        track => track.stop()
                    );

                }
            );


            mediaRecorder.start();


            recordButton.classList.add("hidden");

            stopButton.classList.remove("hidden");

            recordingStatus.classList.remove("hidden");

            sendButton.classList.add("hidden");


            seconds = 0;

            updateTimer();

            timerInterval =
                setInterval(
                    updateTimer,
                    1000
                );


            showMessage("");

        } catch (error) {

            console.error(error);

            showMessage(
                "Impossible d'accéder au microphone. Vérifiez que vous avez autorisé le microphone.",
                "error"
            );

        }

    });


    // =========================================================
    // TIMER
    // =========================================================

    function updateTimer() {

        const minutes =
            Math.floor(seconds / 60)
                .toString()
                .padStart(2, "0");

        const secs =
            (seconds % 60)
                .toString()
                .padStart(2, "0");

        timer.textContent =
            minutes + ":" + secs;

        seconds++;

    }


    // =========================================================
    // ARRETER ENREGISTREMENT
    // =========================================================

    stopButton.addEventListener("click", function () {

        if (
            mediaRecorder &&
            mediaRecorder.state !== "inactive"
        ) {

            mediaRecorder.stop();

        }

        clearInterval(timerInterval);

        recordingStatus.classList.add("hidden");

        stopButton.classList.add("hidden");

        recordButton.classList.remove("hidden");

    });


    // =========================================================
    // ENVOYER VERS SUPABASE
    // =========================================================

    sendButton.addEventListener("click", async function () {

        if (!audioBlob) {

            showMessage(
                "Aucun enregistrement à envoyer.",
                "error"
            );

            return;
        }


        sendButton.disabled = true;

        sendButton.textContent =
            "⏳ Envoi en cours...";


        try {

            // -------------------------------------------------
            // Vérification taille
            // -------------------------------------------------

            const maxSize =
                10 * 1024 * 1024;

            if (audioBlob.size > maxSize) {

                throw new Error(
                    "Votre enregistrement dépasse la limite de 10 MB."
                );

            }


            // -------------------------------------------------
            // Extension
            // -------------------------------------------------

            let extension = "webm";

            if (
                audioBlob.type.includes("mp4")
            ) {

                extension = "mp4";

            } else if (
                audioBlob.type.includes("ogg")
            ) {

                extension = "ogg";
            }


            // -------------------------------------------------
            // Nom sécurisé
            // -------------------------------------------------

            const safeName =
                guestName
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-zA-Z0-9]/g, "_")
                    .substring(0, 40);


            const timestamp =
                Date.now();


            const fileName =
                safeName +
                "_" +
                timestamp +
                "." +
                extension;


            // -------------------------------------------------
            // Upload
            // -------------------------------------------------

            const { data, error } =
                await supabaseClient
                    .storage
                    .from("audios")
                    .upload(
                        fileName,
                        audioBlob,
                        {
                            contentType:
                                audioBlob.type ||
                                "audio/webm",

                            upsert: false
                        }
                    );


            if (error) {

                console.error(error);

                throw error;

            }


            console.log(
                "Fichier envoyé :",
                data
            );


            // -------------------------------------------------
            // SUCCES
            // -------------------------------------------------

            showMessage(
                "💌 Merci " +
                guestName +
                " ! Votre message a bien été envoyé aux mariés. ❤️",
                "success"
            );


            sendButton.textContent =
                "✅ Message envoyé";

            audioPreview.classList.add("hidden");


        } catch (error) {

            console.error(error);

            showMessage(
                "❌ Une erreur est survenue pendant l'envoi : " +
                error.message,
                "error"
            );

            sendButton.disabled = false;

            sendButton.textContent =
                "💌 Envoyer mon message";

        }

    });

</script>

</body>
</html>
